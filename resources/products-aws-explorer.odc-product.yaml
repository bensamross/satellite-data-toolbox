# Product wofs_albers
# url: https://explorer.dea.ga.gov.au/products/wofs_albers.odc-product.yaml
name: wofs_albers
metadata_type: eo
description: Historic Flood Mapping Water Observations from Space
metadata:
  product_type: wofs
  format:
    name: GeoTIFF
measurements:
- name: water
  dtype: int16
  units: '1'
  nodata: 1
  flags_definition:
    dry:
      bits:
      - 7
      - 6
      - 5
      - 4
      - 3
      - 1
      - 0
      values:
        '0': true
      description: No water detected
    sea:
      bits: 2
      values:
        '0': false
        '1': true
      description: Sea
    wet:
      bits:
      - 7
      - 6
      - 5
      - 4
      - 3
      - 1
      - 0
      values:
        '128': true
      description: Clear and Wet
    cloud:
      bits: 6
      values:
        '0': false
        '1': true
      description: Cloudy
    nodata:
      bits: 0
      values:
        '0': false
        '1': true
      description: No data
    high_slope:
      bits: 4
      values:
        '0': false
        '1': true
      description: High slope
    cloud_shadow:
      bits: 5
      values:
        '0': false
        '1': true
      description: Cloud shadow
    noncontiguous:
      bits: 1
      values:
        '0': false
        '1': true
      description: At least one EO band is missing over over/undersaturated
    terrain_or_low_angle:
      bits: 3
      values:
        '0': false
        '1': true
      description: terrain shadow or low solar angle
storage:
  crs: EPSG:3577
  tile_size:
    x: 1.e+05
    y: 1.e+05
  resolution:
    x: 25
    y: -25
  dimension_order:
  - time
  - y
  - x
...
